<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roulette Sector Progression Tracker v4.1</title>
    <style>
        :root { 
            --green: #1b5e20; --red: #d32f2f; --black: #1a1a1a; 
            --gold: #ffc107; --blue: #2196f3; --cell-h: 50px;
        }
        
        body { 
            font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 0; padding: 10px; 
            touch-action: manipulation;
        }

        .container { max-width: 1000px; margin: auto; }

        .header { 
            display: flex; flex-wrap: wrap; gap: 10px; 
            background: #2c3e50; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-bottom: 4px solid var(--gold);
        }
        .header .input-group { flex: 1 1 140px; display: flex; flex-direction: column; font-size: 0.85rem; }
        .header input, .header select { padding: 10px; border-radius: 4px; border: none; margin-top: 5px; background: #eee; font-weight: bold; font-size: 1rem; color: #333; }
        
        .action-btns { width: 100%; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 5px; }
        .btn { 
            flex: 1 1 100px; padding: 14px 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; 
            transition: transform 0.1s, opacity 0.2s; font-size: 0.9rem; text-transform: uppercase;
        }
        .btn:active { transform: scale(0.95); }
        .btn-start { background: var(--gold); color: #000; flex: 2 1 200px; }
        .btn-undo { background: #e67e22; color: white; }
        .btn-reset { background: #7f8c8d; color: white; }

        .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 15px; }
        @media (min-width: 600px) { .stats { grid-template-columns: repeat(4, 1fr); } }
        .stat-card { background: #34495e; padding: 12px; border-radius: 6px; text-align: center; border: 1px solid #455a64; }
        .stat-card div { font-size: 1.2rem; color: var(--gold); font-weight: bold; }

        .table-scroll-container {
            overflow-x: auto; background: var(--green); padding: 30px 20px 60px 20px; 
            border: 4px solid #3e2723; border-radius: 12px; position: relative;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
        }

        .roulette-grid { 
            display: grid; grid-template-columns: 60px repeat(12, 1fr); 
            gap: 2px; position: relative; min-width: 750px; 
        }

        .cell { 
            height: var(--cell-h); display: flex; align-items: center; 
            justify-content: center; font-weight: bold; cursor: pointer; 
            border: 1px solid rgba(255,255,255,0.2); font-size: 1.1rem;
            z-index: 2; /* Ensures they are above background elements */
        }

        .zero { grid-row: 1 / span 3; background: var(--green); border: 2px solid white; }
        .r { background: var(--red); }
        .b { background: var(--black); }

        .physical-chip {
            position: absolute; width: 38px; height: 38px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; font-weight: 900; color: white; z-index: 50;
            transform: translate(-50%, -50%); border: 4px dashed rgba(255,255,255,0.5);
            text-shadow: 1px 1px 2px #000; box-shadow: 0 4px 0 #222, 0 6px 10px rgba(0,0,0,0.6);
            pointer-events: none;
        }

        .panel { background: #2c3e50; padding: 15px; border-radius: 8px; margin-top: 15px; }
        .log { height: 150px; overflow-y: auto; background: #1a1a1a; padding: 10px; font-family: monospace; border-radius: 4px; font-size: 0.9rem; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="input-group"><label>Bankroll</label><input type="number" id="inBank" value="1000"></div>
        <div class="input-group"><label>Unit Size</label><input type="number" id="inUnit" value="5"></div>
        <div class="input-group">
            <label>Mode</label>
            <select id="mode" onchange="toggleMode()">
                <option value="manual">Manual Entry</option>
            </select>
        </div>
        <div class="action-btns">
            <button class="btn btn-start" onclick="startSession()">Start Session</button>
            <button class="btn btn-undo" onclick="undo()">Undo</button>
            <button class="btn btn-reset" onclick="resetAll()">Reset</button>
        </div>
    </div>

    <div class="stats">
        <div class="stat-card">Bankroll<div id="dispBank">0</div></div>
        <div class="stat-card">Profit/Loss<div id="dispProfit">0</div></div>
        <div class="stat-card">Units (L|H)<div id="dispUnits">1 | 1</div></div>
        <div class="stat-card">Peak<div id="dispPeak">0</div></div>
    </div>

    <div id="manualUI" class="table-scroll-container">
        <div class="roulette-grid" id="grid">
            <div class="cell zero" onclick="press(0)" id="cell-0">0</div>
        </div>
    </div>

    <div id="dashboard" style="display:none;">
        <div class="panel">
            <div id="advice" style="text-align:center; font-weight:bold; padding:12px; background:#444; border-radius:5px;">
                Enter 18 numbers to generate prediction.
            </div>
            <div id="log" class="log" style="margin-top:10px;"></div>
        </div>
    </div>
</div>

<script>
    let bank, startBank, peak, history = [], stateStack = [], base, active = false;
    let unitLow = 1, unitHigh = 1;
    const reds = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];

    // Build Table Numbers
    const grid = document.getElementById('grid');
    for (let i = 1; i <= 36; i++) {
        let col = Math.ceil(i / 3);
        let row = i % 3 === 0 ? 1 : (i % 3 === 1 ? 3 : 2);
        let d = document.createElement('div');
        d.className = `cell ${reds.includes(i) ? 'r' : 'b'}`;
        d.id = `cell-${i}`; d.innerText = i;
        d.style.gridColumn = col + 1; 
        d.style.gridRow = row;
        d.onclick = () => press(i);
        grid.appendChild(d);
    }

    function toggleMode() {
        // Reserved for future use
    }

    function saveState() {
        stateStack.push(JSON.stringify({bank, peak, history: [...history], unitLow, unitHigh}));
    }

    function undo() {
        if(stateStack.length === 0) return;
        const s = JSON.parse(stateStack.pop());
        bank = s.bank; peak = s.peak; history = s.history; 
        unitLow = s.unitLow; unitHigh = s.unitHigh;
        updateUI();
    }

    function resetAll() { if(confirm("Reset everything?")) location.reload(); }

    function startSession() {
        startBank = bank = parseFloat(document.getElementById('inBank').value) || 1000;
        base = parseFloat(document.getElementById('inUnit').value) || 5;
        peak = bank; history = []; unitLow = 1; unitHigh = 1; active = true; 
        document.getElementById('dashboard').style.display = 'block';
        updateUI();
    }

    function press(n) {
        if(!active) return;
        saveState();
        history.push(n);
        updateUI(n);
    }

    function updateUI(n) {
        document.getElementById('dispBank').innerText = Math.floor(bank);
        document.getElementById('dispProfit').innerText = Math.floor(bank - startBank);
        document.getElementById('dispUnits').innerText = `${unitLow} | ${unitHigh}`;
        document.getElementById('dispPeak').innerText = Math.floor(peak);
        
        if(n !== undefined) {
            document.getElementById('log').innerHTML = `<div>Spin ${history.length}: <b>${n}</b></div>` + document.getElementById('log').innerHTML;
        }
    }
</script>
</body>
</html>
